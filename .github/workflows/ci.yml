name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck + lint + format + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Root agent guidance budget
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          source = Path('AGENTS.md').read_bytes()
          assert len(source) <= 8192 and len(source.splitlines()) <= 300, 'Keep root AGENTS.md below 300 lines and 8 KiB'
          PYCODE

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install comment parsers
        run: bun run comments:setup

      - name: Typecheck
        run: bun tsc

      - name: Lint
        run: bun lint

      - name: Prettier (check only)
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Generated types are up to date
        run: |
          bun run generate:types
          git diff --exit-code src/generated/openapi-types.ts
