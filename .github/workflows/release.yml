name: Release

# See RELEASING.md for the reviewed branch and tag procedure.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

# Serialize duplicate tag runs without interrupting an active publication.
# npm versions are immutable; let GitHub Release creation finish after publish.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.pack.outputs.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert package.json version matches tag
        # Strip the leading `v` from the tag and compare. If a developer
        # forgets to bump package.json before tagging, fail loudly here
        # rather than publish a tarball whose internal version drifts
        # from the tag (and from the dist-tag).
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json#version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing version $PKG_VERSION"

      - name: Typecheck
        run: bun tsc

      - name: Lint
        run: bun lint

      - name: Prettier (check only)
        run: bun run format:check

      - name: Test
        # NEVER `bun test` — that bypasses vitest setupFiles and MSW.
        run: bun run test

      - name: Build
        run: bun run build

      - name: Generated types are up to date
        run: |
          bun run generate:types
          git diff --exit-code src/generated/openapi-types.ts

      - name: Pack the release
        id: pack
        run: |
          dest="$RUNNER_TEMP/release-artifact"
          mkdir -p "$dest"
          package="$(npm pack --ignore-scripts --pack-destination "$dest")"
          mv "$dest/$package" "$dest/package.tgz"
          printf 'artifact=release-%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Save the validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.artifact }}
          path: ${{ runner.temp }}/release-artifact/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 10
    env:
      PACKAGE_NAME: '@brew.new/sdk'
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: ${{ runner.temp }}/release-artifact/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify the packed release identity
        shell: bash
        run: |
          tar -xOzf "$RUNNER_TEMP/release-artifact/package.tgz" package/package.json | node -e '
            const pkg = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (pkg.name !== process.env.PACKAGE_NAME || `v${pkg.version}` !== process.env.GITHUB_REF_NAME) {
              throw new Error("Packed SDK name or version does not match the release tag.");
            }
            if (JSON.stringify(pkg.publishConfig) !== "{\"access\":\"public\"}") {
              throw new Error("Unexpected npm publish configuration in the packed SDK.");
            }
          '
      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          : "${NODE_AUTH_TOKEN:?Configure NPM_TOKEN in npm-release}"
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';

          const { PACKAGE_NAME, GITHUB_REF_NAME, RUNNER_TEMP } = process.env;
          const archive = `${RUNNER_TEMP}/release-artifact/package.tgz`;
          const registry = 'https://registry.npmjs.org';
          const version = GITHUB_REF_NAME.slice(1);
          const metadataUrl = `${registry}/${encodeURIComponent(PACKAGE_NAME)}/${encodeURIComponent(version)}`;
          const integrity = `sha512-${createHash('sha512').update(readFileSync(archive)).digest('base64')}`;

          async function alreadyPublished() {
            const response = await fetch(metadataUrl, {
              headers: { 'cache-control': 'no-cache' },
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            });
            if (response.status === 404) return false;
            if (!response.ok) throw new Error(`npm version lookup failed (${response.status}).`);
            const published = await response.json();
            if (published.name !== PACKAGE_NAME || published.version !== version ||
                published.dist?.integrity !== integrity) {
              throw new Error('The registry has a different archive for this version.');
            }
            console.log('The exact release archive is already on npm.');
            return true;
          }

          if (!(await alreadyPublished())) {
            const result = spawnSync('npm', [
              'publish', archive, `--registry=${registry}`, '--ignore-scripts',
              '--provenance', '--access', 'public',
            ], { stdio: 'inherit' });
            if (result.status !== 0 && !(await alreadyPublished())) {
              process.exitCode = result.status ?? 1;
            }
          }
          NODE

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
